[project]
name = "bq-query-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic[vertex]>=2.3.0",
    "google-cloud-bigquery>=3.46.2",
    "google-genai>=2.33.0",
    "langgraph>=1.2.17",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    "integration: needs Google Cloud credentials (BigQuery, or Vertex AI for Gemini); skipped when they are missing",
]
